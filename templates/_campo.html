<div class="campo{% if campo.errors %} com-erro{% endif %}{% if classe %} {{ classe }}{% endif %}">
  {% if campo.field.widget.input_type == 'checkbox' %}
    <label class="check">{{ campo }} {{ campo.label }}</label>
  {% else %}
    <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>
    {{ campo }}
  {% endif %}
  {% for erro in campo.errors %}<div class="erro-campo" id="{{ campo.auto_id }}_erro">{{ erro }}</div>{% endfor %}
  {% if campo.help_text %}<span class="ajuda">{{ campo.help_text|safe }}</span>{% endif %}
</div>
